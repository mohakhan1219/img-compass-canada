name: Deploy prod-demo (tags)

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod-demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push tagged image
        env:
          ECR: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.ref_name }}
        run: |
          docker build -t "$ECR:$TAG" -t "$ECR:prod-demo" .
          docker push "$ECR:$TAG"
          docker push "$ECR:prod-demo"
      - name: Deploy tagged image
        env:
          AWS_REGION: ca-central-1
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          IMAGE: ${{ secrets.ECR_REPOSITORY }}:${{ github.ref_name }}
        run: bash scripts/ecs-deploy.sh
