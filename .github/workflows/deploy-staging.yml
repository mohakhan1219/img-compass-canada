name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag already pushed to ECR
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ca-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Deploy
        env:
          AWS_REGION: ca-central-1
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          IMAGE: ${{ secrets.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}
        run: bash scripts/ecs-deploy.sh
